[package]
name = "over-the-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust CLI for OverTheWire games"
license = "MIT"
repository = "https://github.com/batusaribay/over-the-wire"
homepage = "https://github.com/batusaribay/over-the-wire"
readme = "README.md"
keywords = ["overthewire", "games", "cli", "security", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "over-the-wire"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
ego-tree = "0.11"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
